[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_BASE_URL = "/api/v2"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/v2/*"
  to = "http://127.0.0.1:8000/api/v2/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
