# Render Infrastructure Blueprint for AE-03 Directive V2 Backend
services:
  - type: web
    name: ae03-directive-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: PRIMARY_PROVIDER
        value: openrouter_1
      - key: PRIMARY_MODEL
        value: openai/gpt-4o-mini
